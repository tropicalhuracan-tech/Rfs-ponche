# Deploy estático a GitHub Pages (sin Jekyll / sin legacy worker).
# Fuente de publicación del repo: Settings → Pages → Source = GitHub Actions.
name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez. No cancelar el que ya está publicando
# (evita sitios a medias cuando llegan varios pushes seguidos).
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static site files
        run: |
          set -euo pipefail
          required=(
            index.html
            app.js
            cloud.js
            cloud-config.js
            styles.css
            sw.js
            manifest.json
            .nojekyll
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Falta archivo requerido: $f"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          if ! grep -q 'id="appVersionBadge"' index.html; then
            echo "::error::index.html no parece la app RFS Ops"
            exit 1
          fi
          echo "Validación OK"
          grep -o 'App v[0-9]*[^<]*' index.html | head -1 || true

      - name: Prepare publish folder
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          # Solo assets de la PWA (sin .git, workflows ni notas internas)
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='.pages-nudge' \
            --exclude='*.md' \
            ./ _site/
          # Garantiza bypass de Jekyll por si algún paso lo vuelve a tocar
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/app.js
          du -sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
